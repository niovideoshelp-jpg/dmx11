name: Render video

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sfx:
        description: Incluir efeitos sonoros (true/false)
        default: 'true'

jobs:
  render:
    name: Render ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [Intro, Parte1, Parte2, Parte3, Parte4, Final]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Install render browser
        run: npx remotion browser ensure

      - name: Render ${{ matrix.part }}
        run: >
          npx remotion render src/index.ts ${{ matrix.part }} out/${{ matrix.part }}.mp4
          --codec=h264 --crf=18 --concurrency=4
          --props='{"sfx": ${{ github.event.inputs.sfx || 'true' }}}'

      - uses: actions/upload-artifact@v4
        with:
          name: dmx11-${{ matrix.part }}
          path: out/${{ matrix.part }}.mp4
          retention-days: 30

  join:
    name: Join full film
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmx11-*
          merge-multiple: true
          path: parts

      - name: Concatenate parts in order
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd parts
          for p in Intro Parte1 Parte2 Parte3 Parte4 Final; do echo "file '$p.mp4'" >> list.txt; done
          ffmpeg -hide_banner -f concat -safe 0 -i list.txt -c copy ../DN-XI-completo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: dmx11-completo
          path: DN-XI-completo.mp4
          retention-days: 30
